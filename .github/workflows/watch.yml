name: everyworn 재고 감시

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정에 따라 몇 분씩 밀릴 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: everyworn-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 재고 확인
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_SOLDOUT: ${{ vars.NOTIFY_SOLDOUT || 'true' }}
        run: python3 watcher.py

      - name: 상태 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json STATUS.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "재고 상태 갱신"
            git push
          fi
